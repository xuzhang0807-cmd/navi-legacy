services:
  navi:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${NAVI_PORT:-8787}:8787"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_PATH: /app/data/navi.sqlite
      AUTH_ENABLED: "true"
      AUTH_REQUIRED_FOR_READ: "false"
      AUTH_USERNAME: ${AUTH_USERNAME:?Set AUTH_USERNAME in .env}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Set AUTH_PASSWORD in .env}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
      BLOG_NAVIGATION_TOKEN: ${BLOG_NAVIGATION_TOKEN:?Set BLOG_NAVIGATION_TOKEN in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
    volumes:
      - navi-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      navi-blog-link:
        aliases:
          - navi

volumes:
  navi-data:

networks:
  navi-blog-link:
    external: true
    name: ${NAVI_NETWORK:-navi-blog-link}
